<body>

            <ul>

    <main>
        <!-- Formulario POST product, falta probarlo, sin terminar -->
        <section>

            <h3>Crear producto</h3>

            <form id="createProductForm">

                <label for="categoriaProd">Categoria</label>
                <select name="categoria" id="categoriaProd" required>
                    <option value="Vinilo">Vinilo</option>
                    <option value="CD">CD</option>
                </select>

                <label for="imagenProd">Imagen</label>
                <input type="text" name="imagen" id="imagenProd" required>

                <label for="nombrenProd">Album</label>
                <input type="text" name="nombre" id="nombreProd" required>

                <label for="artistaProd">Artista</label>
                <input type="text" name="artista" id="artistaProd" required>

                <label for="precioProd">Precio</label>
                <input type="number" name="precio" id="precioProd" min="1" required>

                <input type="submit" value="Crear producto">

            </form>

        </section>

        <section id="contenedor-productos"></section>
    </main>
    <script>
        const urlBase = "http://localhost:3000";
        const contenedorProductos = document.getElementById("contenedor-productos");
        const getProductForm = document.getElementById("getProductForm");
        const createProductForm = document.getElementById("createProductForm");

        createProductForm.addEventListener("submit", async event => {

            event.preventDefault(); 

            const formData = new FormData(event.target);
            console.log(formData);

            const formObj = Object.fromEntries(formData.entries());
            console.log(formObj);
          

            console.log(JSON.stringify(formObj));
            
            try {
                const response = await fetch(`${urlBase}/api/productos`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(formObj)
                });

                const data = await response.json(); 
                console.log(data.message);
                alert(data.message);

            } catch (error) {
                console.error("Error al obtener productos: ", error);
            }

        })

    </script>
</body>

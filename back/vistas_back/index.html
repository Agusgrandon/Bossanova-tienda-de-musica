<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Bossanova: venta de discos, vinilos y hardware para escuchar la mejor música">
    <title>Bossanova - Administrador</title>

    <!--Se carga el mismo ícono en dos formatos por si el navegador falla con alguno-->
    <link rel="icon" sizes="any" href="../../front/assets/logo/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="../../front/assets/logo/favicon.svg">

    <!--Fuentes-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Syne:wght@700;800&display=swap"
        rel="stylesheet">

    <!--Bootstrap-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css">

    <link rel="stylesheet" href="../../front/css/styles.css">
    <script src="../../front/js/tema.js"></script>

</head>

<body>
    <header class="header">
        <div class="container">
            <a class="header-logo" href="index.html">
                <img class="solo-claro" src="../../front/assets/logo/logo-claro.svg" alt="Bossanova" width="206"
                    height="40">
                <img class="solo-oscuro" src="../../front/assets/logo/logo-oscuro.svg" alt="Bossanova" width="206"
                    height="40">
            </a>

            <div class="header-acciones">
                <nav class="header-acciones">
                    <a class="boton boton-secundario" href="index.html">Principal</a>
                    <a class="boton boton-secundario" href="get.html">Obtener</a>
                    <a class="boton boton-secundario" href="post.html">Crear</a>
                    <a class="boton boton-secundario" href="put.html">Modificar</a>
                    <a class="boton boton-secundario" href="delete.html">Eliminar</a>
                    <a class="boton boton-secundario" href="../../front/index.html">Ir a la tienda</a>
                </nav>
                <button class="boton boton-secundario" type="button" id="boton-tema" aria-label="Cambiar tema"
                    title="Cambiar tema">
                    <img class="solo-claro" src="../../front/assets/iconos/luna.svg" alt="" width="20" height="20">
                    <img class="solo-oscuro" src="../../front/assets/iconos/sol.svg" alt="" width="20" height="20">
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <h1>Productos</h1>
        <section class="row g-4" id="contenedor-productos"></section>
    </main>
    <script>
        const urlBase = "http://localhost:3000";
        const contenedorProductos = document.getElementById("contenedor-productos");

        async function obtenerProductos() {
            try {

                const response = await fetch(`${urlBase}/api/productos`);
                console.log(response);
                const data = await response.json();
                const productos = data.payload;
                console.table(productos);
                renderizarProductos(productos);

            } catch (error) {
                console.error("Error en servidor: ", error);
            }
        }

        function renderizarProductos(array) {
            let htmlProductos = "";

            array.forEach(producto => {
                htmlProductos += `
                    <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                        <article class="card ${producto.activo ? "" : "card-inactiva"}">
                            <img src="../../front/assets/productos/${producto.imagen}" alt="${producto.nombre}" width="250" height="250">
                            <div class="card-datos">
                                <span class="card-tipo">#${producto.id} · ${producto.tipo}</span>
                                <h2 class="card-nombre">${producto.nombre}</h2>
                                ${producto.artista ? `<p class="card-artista">${producto.artista}</p>` : ""}
                                <p class="card-precio">$${Number(producto.precio).toLocaleString("es-AR")}</p>
                                ${producto.activo ? "" : `<p class="card-tipo card-inactivo">Inactivo</p>`}
                            </div>
                        </article>
                    </div>
                `
            });
            contenedorProductos.innerHTML = htmlProductos;
        }

        obtenerProductos()
    </script>

    <footer class="footer">
        <div class="container">
            <p class="nombres-alumnos">Agustina Grandon - Mateo Rapetti</p>
        </div>
    </footer>
</body>

</html>

<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light dark">
        <meta name="description" content="Bossanova: venta de discos, vinilos y hardware para escuchar la mejor música">
        <title>Bossanova</title>
        
        <!--Se carga el mismo ícono en dos formatos por si el navegador falla con alguno-->
        <link rel="icon" sizes="any" href="assets/logo/favicon.ico">
        <link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg">

        <!--Fuentes-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">

        <!--Bootstrap-->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css">

        <link rel="stylesheet" href="css/styles.css">
        <script src="js/tema.js"></script>
    </head>

    <body>
        <header class="header">
            <div class="container">
                <a class="header-logo" href="index.html">
                    <img class="solo-claro" src="assets/logo/logo-claro.svg" alt="Bossanova" width="206" height="40">
                    <img class="solo-oscuro" src="assets/logo/logo-oscuro.svg" alt="Bossanova" width="206" height="40">
                </a>

            <div class="header-acciones">
                <nav class="header-acciones">
                    <a class="boton boton-secundario" href="login.html" aria-label="Acceso administrador" title="Acceso administrador">
                        <img class="solo-claro" src="assets/iconos/llave-claro.svg" alt="" width="20" height="20">
                        <img class="solo-oscuro" src="assets/iconos/llave-oscuro.svg" alt="" width="20" height="20">
                    </a>
                </nav>
                <button class="boton boton-secundario" type="button" id="boton-tema" aria-label="Cambiar tema" title="Cambiar tema">
                    <img class="solo-claro" src="assets/iconos/luna.svg" alt="" width="20" height="20">
                    <img class="solo-oscuro" src="assets/iconos/sol.svg" alt="" width="20" height="20">
                </button>
            </div>
        </div>
    </header>
        
        <main class="container bienvenida">
            <h1>¡Bienvenido a Bossanova!</h1>
            <p>Los mejores sonidos</p>
            
            <form class="formulario" id="form-nombre">
                <label for="nombre">Nombre</label>
                <input id="nombre" name="nombre" type="text"
                    required maxlength="25"
                    autocomplete="name" placeholder="Ingrese su nombre">

                <button class="boton" type="submit">Ingresar</button>
            </form>
        </main>
        
        <footer class="footer">
            <div class="container">
                <p class="nombres-alumnos">Agustina Grandon - Mateo Rapetti</p>
            </div>
        </footer>
        
        <script src="js/index.js"></script>
    </body>
</html>

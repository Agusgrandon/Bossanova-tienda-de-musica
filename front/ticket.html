<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light dark">
        <meta name="description" content="Bossanova: venta de discos, vinilos y hardware para escuchar la mejor música">
        <title>Bossanova | Ticket</title>
        
        <!--Se carga el mismo ícono en dos formatos por si el navegador falla con alguno-->
        <link rel="icon" sizes="any" href="assets/logo/favicon.ico">
        <link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg">

        <!--Fuentes-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">

        <!--Bootstrap-->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css">

        <link rel="stylesheet" href="css/styles.css">
        <script src="js/tema.js"></script>
        <!--jsPDF-->
        <script src="https://unpkg.com/jspdf@4.2.1/dist/jspdf.umd.min.js"></script>
    </head>

    <body>
        <header class="header">
            <div class="header-logo">
                <img class="solo-claro" src="assets/logo/logo-claro.svg" alt="Bossanova" width="206" height="40">
                <img class="solo-oscuro" src="assets/logo/logo-oscuro.svg" alt="Bossanova" width="206" height="40">
            </div>
        </header>

        <main class="container">
            <section class="ticket">
                <h1>Bossanova</h1>
                <p>Cliente: <span id="ticket-nombre"></span></p>
                <p>Fecha: <span id="ticket-fecha"></span></p>

                <ul id="ticket-productos">
                    <!--Productos generados en ticket.js-->
                </ul>

                <p class="ticket-total">Total: <span id="ticket-total"></span></p>

                <div class="ticket-acciones">
                    <button class="boton boton-secundario" type="button" id="boton-descargar">Descargar PDF</button>
                    <button class="boton" type="button" id="boton-salir">Salir</button>
                </div>
            </section>
        </main>

        <footer class="footer">
            <div class="container">
                <p class="nombres-alumnos">Agustina Grandon - Mateo Rapetti</p>
            </div>
        </footer>

        <script src="js/storage-carrito.js"></script>
        <script src="js/ticket.js"></script>
    </body>
</html>
